{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHelp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'helpdesk/style.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">StudyHelp</a>
        <div class="d-flex">
            {% if user.is_authenticated %}
                <span class="navbar-text me-2">Hello, {{ user.username }}</span>
                <a class="btn btn-outline-light" href="/accounts/logout/">Logout</a>
            {% else %}
                <a class="btn btn-outline-light" href="/accounts/login/">Login</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2">
            <div class="list-group mb-4">
                <a href="/" class="list-group-item list-group-item-action">Help Videos</a>
                <a href="/yourguide/" class="list-group-item list-group-item-action">YourGuide</a>
            </div>
        </div>
        <div class="col-md-10">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
</body>
</html>
