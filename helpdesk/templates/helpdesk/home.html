{% extends 'helpdesk/base.html' %}
{% block content %}
<h2>Applications</h2>
<div class="row">
    {% for app in apps %}
    <div class="col-md-4 mb-3">
        <div class="card h-100">
            <div class="card-body d-flex flex-column justify-content-between">
                <h5 class="card-title">{{ app }}</h5>
                <a href="{% url 'helpdesk:app_detail' app %}" class="btn btn-primary mt-3">View Help Videos</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
